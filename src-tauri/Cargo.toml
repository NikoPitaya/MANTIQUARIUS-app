[package]
name = "manti-quarius"
version = "0.1.0"
description = "MANTIQUARIUS desktop and Android app"
authors = ["NikoPitaya"]
edition = "2021"

[lib]
name = "manti_quarius_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
